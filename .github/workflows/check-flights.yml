name: Check flight prices

on:
  schedule:
    # Una vez por dia (12:00 UTC). Ojo con la cuota: SerpAPI free = 100 busquedas/mes.
    # Cada corrida gasta 1 busqueda por cada ruta del config.yml.
    # 1 vez/dia con 2 rutas = ~60/mes. Para mas frecuencia, pasa a plan pago.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no envia Telegram)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: check-flights
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar precios
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python check_flights.py --dry-run
          else
            python check_flights.py
          fi

      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || git commit -m "chore: actualizar precios [skip ci]"
          git push
