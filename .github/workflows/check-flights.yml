name: Check flight prices

on:
  schedule:
    # Cada 2 hs entre las 9:00 y las 21:00 (hora argentina, UTC-3). No corre de noche.
    # Hora ARG: 9,11,13,15,17,19,21  ->  UTC: 12,14,16,18,20,22,0
    # 7 corridas/dia x 30 = ~210 busquedas/mes (plan free: 250/mes).
    # Cada corrida gasta 1 busqueda por cada ruta del config.yml.
    - cron: "0 0,12,14,16,18,20,22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no envia Telegram)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: check-flights
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar precios
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python check_flights.py --dry-run
          else
            python check_flights.py
          fi

      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || git commit -m "chore: actualizar precios [skip ci]"
          git push
